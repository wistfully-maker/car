odom_model_type: omni

# Deterministic initialization at competition start point P.
# Explicit values overwrite any pose left on the parameter server.
initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0

# Allow about 20 cm / 10 deg manual placement uncertainty.
initial_cov_xx: 0.04
initial_cov_yy: 0.04
initial_cov_aa: 0.03046

# Never reuse the previous run's terminal pose as the next initial pose.
save_pose_rate: -1.0
force_update_after_initialpose: true

# 减少转弯时粒子过度扩散
odom_alpha1: 0.10
odom_alpha2: 0.10
odom_alpha3: 0.25
odom_alpha4: 0.10
odom_alpha5: 0.15

# 保留足够粒子处理相似走廊
min_particles: 600
max_particles: 3000
kld_err: 0.03
kld_z: 0.99

# 使用更适合静态地图的Likelihood Field
laser_max_beams: 70
laser_model_type: likelihood_field
laser_z_hit: 0.85
laser_z_rand: 0.15
laser_sigma_hit: 0.15
laser_likelihood_max_dist: 0.40

# 转弯时更及时更新
update_min_d: 0.04
update_min_a: 0.04
resample_interval: 2

transform_tolerance: 0.50

# 第一轮先不启用随机恢复，避免误跳
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0

odom_frame_id: odom
base_frame_id: base_link
global_frame_id: map

use_map_topic: false
first_map_only: true
gui_publish_rate: 2.0
