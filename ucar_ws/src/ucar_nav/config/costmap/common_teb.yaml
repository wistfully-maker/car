footprint:
  - [0.160, -0.120]
  - [0.160, 0.120]
  - [-0.160, 0.120]
  - [-0.160, -0.120]

obstacle_layer:
  enabled: true
  combination_method: 1
  track_unknown_space: true
  obstacle_range: 2.0
  raytrace_range: 3.0
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: laser_frame
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    inf_is_valid: true

inflation_layer:
  enabled: true
  inflation_radius: 0.15
  cost_scaling_factor: 5

static_layer:
  enabled: true
