DWAPlannerROS:
  acc_lim_x: 0.80
  acc_lim_y: 0.80
  acc_lim_trans: 0.80
  acc_lim_theta: 1.50

  max_vel_trans: 0.45
  min_vel_trans: 0.10
  max_vel_x: 0.45
  min_vel_x: -0.20
  max_vel_y: 0.20
  min_vel_y: -0.20
  max_vel_theta: 0.60
  min_vel_theta: 0.18

  trans_stopped_vel: 0.05
  theta_stopped_vel: 0.10

  yaw_goal_tolerance: 0.15
  xy_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true

  sim_time: 1.2
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 8
  vy_samples: 5
  vth_samples: 16

  path_distance_bias: 40.0
  goal_distance_bias: 16.0
  occdist_scale: 0.20
  forward_point_distance: 0.25
  stop_time_buffer: 0.50
  scaling_speed: 0.15
  max_scaling_factor: 0.30

  oscillation_reset_dist: 0.05
  oscillation_reset_angle: 0.10
  prune_plan: true
  publish_traj_pc: false
  publish_cost_grid_pc: false
  global_frame_id: odom
